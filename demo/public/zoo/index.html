<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes (silent bug zoo)</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  input { width: 70%; padding: .5rem; } button { padding: .5rem 1rem; }
  #toast { color: #0a7d32; min-height: 1.5rem; } li { padding: .25rem 0; }
  footer { margin-top: 3rem; font-size: .85rem; color: #666; }
</style>
</head>
<body>
<h1>Notes</h1>
<form id="f"><input id="text" placeholder="Write a note" autocomplete="off"> <button>Save</button></form>
<p id="toast" role="status"></p>
<ul id="list"></ul>
<footer>Senyap silent bug zoo: every page looks the same and always says "Saved!"; <code>?bug=</code> picks what breaks underneath (http_5xx, http_4xx, request_failed, console_error, js_exception, env_leak, test_key, none). <a href="https://github.com/PugarHuda/senyap-cli">github.com/PugarHuda/senyap-cli</a></footer>
<script>
const bug = new URLSearchParams(location.search).get('bug') || 'none';
const list = document.getElementById('list');
const toast = document.getElementById('toast');

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  // Every kind posts to the zoo API; the server answers 500/422 for http_5xx/http_4xx.
  const body = { text };
  if (bug === 'test_key') body.payment_key = 'pk_test_51QbZooDemoKey000000000000';
  const res = await fetch('/api/zoo?bug=' + encodeURIComponent(bug), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => null);
  // Optimistic UI: whatever happened, the note is shown and the user is told it saved.
  const li = document.createElement('li'); li.textContent = text; list.append(li);
  toast.textContent = 'Saved!';
  document.getElementById('text').value = '';
  if (bug === 'request_failed') fetch('https://sync.notes-backup.invalid/push', { method: 'POST', body: text }).catch(() => {});
  if (bug === 'console_error') console.error('sync failed: quota exceeded');
  if (bug === 'js_exception') setTimeout(() => { null.refresh(); }, 0);
  if (bug === 'env_leak') fetch('https://staging.notes-analytics.test/collect', { method: 'POST', mode: 'no-cors', body: 'note_saved' }).catch(() => {});
  void res;
});
</script>
</body>
</html>
